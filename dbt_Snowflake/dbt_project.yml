
name: 'my_project'
version: '1.0.0'

profile: 'my_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
    my_project:
      staging:
        +schema: staging 
      prep:
        +schema: prep
        +materialized: table
      mart:
        +schema: mart
        +materialized: table
      report:
        +schema: report
        +materialized: table
